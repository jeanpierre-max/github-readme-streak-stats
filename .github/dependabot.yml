version: 2
updates:
  # Dependencias PHP (composer)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      php-deps:
        patterns: ["*"]
    open-pull-requests-limit: 3

  # Dependencias Node.js (pnpm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      node-deps:
        patterns: ["*"]
    open-pull-requests-limit: 3
